version: 2

models:
  - name: bronze_customers
    description: "{{ doc('bronze_layer') }}"
  - name: bronze_orders
    description: "{{ doc('bronze_layer') }}"
  - name: silver_orders
    description: "{{ doc('silver_orders') }}"
    columns:
      - name: order_id
        description: Order identifier
        data_tests:
          - unique
          - not_null
      - name: order_date
        description: Date of the order
      - name: amount
        description: Order amount in euros
        data_tests:
          - is_positive
      - name: customer_id
        description: Customer who placed the order
      - name: customer_name
        description: Customer name
        data_tests:
          - dbt_utils.not_empty_string
      - name: country
        description: Country where the customer lives
  - name: gold_revenue_by_country
    description: "{{ doc('gold_revenue_by_country') }}"
    config:
      contract:
        enforced: true
    columns:
      - name: country
        description: Country name
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: country_code
        description: ISO 3166-1 alpha-2 country code, from the country_codes seed
        data_type: varchar
        data_tests:
          - not_null
      - name: region
        description: Region of Europe, from the country_codes seed
        data_type: varchar
      - name: number_of_orders
        description: Number of completed orders
        data_type: bigint
        data_tests:
          - is_positive
      - name: revenue
        description: Total amount of the completed orders in euros
        data_type: decimal(38, 2)
        data_tests:
          - is_positive
      - name: average_order_value
        description: Revenue divided by the number of orders, computed with the safe_divide macro
        data_type: double
        data_tests:
          - is_positive
  - name: metricflow_time_spine
    description: "{{ doc('metricflow_time_spine') }}"
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Day
        granularity: day
