version: 2

sources:
  - name: raw
    description: "{{ doc('raw_source') }}"
    meta:
      external_location: "../data/{name}.csv"
    config:
      loaded_at_field: _loaded_at
      # Only warn, the sample data is static so it is always stale
      freshness:
        warn_after: {count: 1, period: day}
    tables:
      - name: raw_customers
        description: One row per customer
        columns:
          - name: customer_id
            description: Customer identifier
            data_tests:
              - unique
              - not_null
          - name: customer_name
            description: Customer name
          - name: country
            description: Country where the customer lives
          - name: _loaded_at
            description: Time the row was loaded
      - name: raw_orders
        description: One row per order
        columns:
          - name: order_id
            description: Order identifier
            data_tests:
              - unique
              - not_null
          - name: customer_id
            description: Customer who placed the order
            data_tests:
              - relationships:
                  arguments:
                    to: source('raw', 'raw_customers')
                    field: customer_id
          - name: order_date
            description: Date of the order
          - name: amount
            description: Order amount in euros
            data_tests:
              - is_positive:
                  arguments:
                    allow_zero: true
          - name: status
            description: Order status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["completed", "cancelled"]
          - name: _loaded_at
            description: Time the row was loaded
