version: 2

seeds:
  - name: country_codes
    description: Reference data with the ISO code and the region of each country
    columns:
      - name: country
        description: Country name
        data_tests:
          - unique
          - not_null
      - name: country_code
        description: ISO 3166-1 alpha-2 country code
      - name: region
        description: Region of Europe the country belongs to
