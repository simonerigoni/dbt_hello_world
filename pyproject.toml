[project]
name = "dbt-hello-world"
version = "0.1.0"
description = "A simple dbt Hello World with DuckDB and bronze, silver and gold layers"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
requires-python = ">=3.15"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
]

[project.scripts]
dbt-hello-world = "dbt_hello_world.cli:main"

[project.urls]
Repository = "https://github.com/simonerigoni/dbt_hello_world"
Medium = "https://medium.com/@simone-rigoni01/hello-world-from-dbt-ec4c4315056c"
Documentation = "https://simonerigoni.github.io/dbt_hello_world/"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "dbt_project"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src", "tests"]
